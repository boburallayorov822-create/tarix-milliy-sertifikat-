<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarix Milliy Sertifikat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#f1f5f9;color:#172554;font-family:Arial,sans-serif}
header,.card{padding:17px;border-radius:15px;margin-bottom:14px}
header{background:#173b75;color:white}
.card{background:white}
button,input{width:100%;padding:13px;margin-top:9px;border-radius:10px;font-size:16px}
button{border:0;background:#2459a9;color:white;font-weight:bold}
button:disabled{opacity:.5}
input{border:1px solid #cbd5e1}
.option{background:#e8eef8;color:#172554;text-align:left;font-weight:normal}
.option.selected{background:#2459a9;color:white}
.secondary{background:#e2e8f0;color:#172554}
.note{color:#64748b;font-size:13px}
#testArea{display:none}
#error{color:#b91c1c;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h2>📚 Tarix Milliy Sertifikat</h2>
<p>Bilimingizni sinang!</p>
</header>

<div class="card" id="menu">
<h3>📝 Test ishlash</h3>
<label>6 belgili test kodi:</label>
<input id="code" maxlength="6" placeholder="Masalan: XOR3YY">
<button onclick="startTest()">Testni boshlash</button>
<p class="note">Test savollari shu oynada ko‘rsatiladi.</p>
<p id="error"></p>
</div>

<div class="card" id="testArea">
<h3 id="testName">Tarix testi</h3>
<p id="progress"></p>
<hr>
<h3 id="question"></h3>
<div id="options"></div>
<div id="writtenArea" style="display:none">
<input id="written" placeholder="Javobingizni yozing">
<button onclick="saveWritten()">Javobni saqlash</button>
</div>
<p id="status" class="note"></p>
<div style="display:flex;gap:8px">
<button class="secondary" id="prev" onclick="move(-1)">⬅️ Oldingi</button>
<button id="next" onclick="move(1)">Keyingi ➡️</button>
</div>
<button id="finish" onclick="finishTest()">✅ Testni yakunlash</button>
<p id="testError"></p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Amaldagi Cloudflare tunnel manzili:
const API = 'https://posters-amino-tooth-gates.trycloudflare.com';
let code = '';
let questions = [];
let index = 0;
const answers = {};

async function api(path, data={}) {
  const response = await fetch(API + path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      ...data,
      initData:tg.initData
    })
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'Xatolik yuz berdi.');
  return result;
}

function showError(id, message) {
  document.getElementById(id).textContent = message;
}

async function startTest() {
  code = document.getElementById('code').value.trim().toUpperCase();
  showError('error','');
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    showError('error','6 belgili test kodini kiriting.');
    return;
  }
  try {
    const data = await api('/api/start',{code});
    questions = data.questions;
    index = 0;
    for (const key in answers) delete answers[key];
    document.getElementById('testName').textContent = data.name;
    document.getElementById('menu').style.display='none';
    document.getElementById('testArea').style.display='block';
    renderQuestion();
  } catch(e) {
    showError('error',e.message);
  }
}

function splitQuestion(text) {
  const re = /(?:^|\s|[\r\n])([ABCD])[\).]\s*/g;
  const matches = [...String(text).matchAll(re)];
  if (matches.length < 2) return {stem:String(text),options:[]};
  const stem = String(text).slice(0,matches[0].index).trim();
  const options = [];
  for (let i=0;i<matches.length;i++) {
    const start = matches[i].index + matches[i][0].length;
    const end = i+1<matches.length ? matches[i+1].index : String(text).length;
    options.push({letter:matches[i][1],text:String(text).slice(start,end).trim()});
  }
  return {stem:stem || String(text),options};
}

function renderQuestion() {
  const q = questions[index];
  const parsed = splitQuestion(q.question || '');
  document.getElementById('progress').textContent =
    `Savol ${index+1} / ${questions.length}`;
  document.getElementById('question').textContent =
    `${q.number}. ${parsed.stem}`;
  document.getElementById('options').innerHTML='';
  document.getElementById('writtenArea').style.display =
    q.type==='written' ? 'block':'none';
  document.getElementById('written').value=answers[q.number] || '';
  document.getElementById('status').textContent='';
  document.getElementById('testError').textContent='';

  if(q.type==='written') {
    document.getElementById('options').style.display='none';
  } else {
    document.getElementById('options').style.display='block';
    ['A','B','C','D'].forEach(letter=>{
      const b=document.createElement('button');
      b.className='option'+(answers[q.number]===letter?' selected':'');
      b.textContent=letter;
      b.onclick=()=>saveChoice(letter);
      document.getElementById('options').appendChild(b);
    });
  }
  document.getElementById('prev').disabled=index===0;
  document.getElementById('next').textContent =
    index===questions.length-1 ? 'Oxirgi savol':'Keyingi ➡️';
}

async function saveChoice(letter) {
  const q=questions[index];
  try {
    await api('/api/answer',{code,number:q.number,answer:letter});
    answers[q.number]=letter;
    if (index < questions.length - 1) {
      index++;
      renderQuestion();
    } else {
      renderQuestion();
      document.getElementById('status').textContent='Javob saqlandi ✓';
    }
  } catch(e) {
    showError('testError',e.message);
  }
}

async function saveWritten() {
  const q=questions[index];
  const value=document.getElementById('written').value.trim();
  try {
    await api('/api/answer',{code,number:q.number,answer:value});
    answers[q.number]=value;
    document.getElementById('status').textContent='Javob saqlandi ✓';
  } catch(e) {
    showError('testError',e.message);
  }
}

async function move(step) {
  const q=questions[index];
  if(q.type==='written' &&
     document.getElementById('written').value.trim()!==(answers[q.number]||'')) {
    await saveWritten();
    if(document.getElementById('testError').textContent) return;
  }
  index=Math.max(0,Math.min(questions.length-1,index+step));
  renderQuestion();
}

async function finishTest() {
  if(!confirm('Testni yakunlaysizmi? Javoblaringiz tekshiriladi.')) return;
  const q=questions[index];
  if(q.type==='written' &&
     document.getElementById('written').value.trim()!==(answers[q.number]||'')) {
    await saveWritten();
    if(document.getElementById('testError').textContent) return;
  }
  try {
    document.getElementById('finish').disabled=true;
    const result=await api('/api/finish',{code});
    document.getElementById('testArea').innerHTML =
      `<h2>🎉 Test yakunlandi!</h2>
       <p>${result.name}</p>
       <h1>${result.score} / ${result.total}</h1>
       <h3>Natija: ${result.percent}%</h3>
       <h3>Daraja: ${result.level || 'MOCK'}</h3>
       <p>Natijangiz saqlandi.</p>
       ${result.certificate ? `<img src="${API}${result.certificate}" alt="Sinov sertifikati" style="width:100%;border-radius:12px;margin-top:12px"><a href="${API}${result.certificate}" download="sinov_sertifikati.png" style="display:block;text-align:center;padding:14px;background:#2459a9;color:white;border-radius:10px;margin-top:12px;text-decoration:none">📥 Sertifikatni yuklab olish</a>` : '<p>Sertifikat hozircha tayyor emas.</p>'}`;
  } catch(e) {
    showError('testError',e.message);
    document.getElementById('finish').disabled=false;
  }
}
</script>
</body>
</html>
